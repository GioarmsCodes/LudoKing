<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎲 Ludo King</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ff3d5a;--red-l:#ff8fa3;--red-d:#c0001a;
  --blue:#2196f3;--blue-l:#64b5f6;--blue-d:#0d47a1;
  --green:#00c853;--green-l:#69f0ae;--green-d:#007b33;
  --yellow:#ffd600;--yellow-l:#ffff52;--yellow-d:#c7a500;
  --bg:#1a0533;--surf:#26084a;--surf2:#331060;--border:#4a1880;--text:#fff;--dim:#b39ddb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background-image:
    radial-gradient(ellipse at 20% 15%,rgba(255,61,90,.2) 0,transparent 50%),
    radial-gradient(ellipse at 80% 85%,rgba(33,150,243,.18) 0,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(170,0,255,.1) 0,transparent 60%);
}

/* ── JOIN ── */
#joinScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 18px;width:100%;min-height:100vh}
#joinScreen.hidden{display:none}
.logo h1{
  font-family:'Boogaloo',cursive;font-size:3.2rem;text-align:center;letter-spacing:.04em;
  background:linear-gradient(90deg,#ff3d5a,#ff9800,#ffd600,#00c853,#2196f3,#aa00ff);
  background-size:200%;animation:rainbow 3s linear infinite;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
@keyframes rainbow{0%{background-position:0%}100%{background-position:200%}}
.logo p{color:var(--dim);text-align:center;margin-top:4px}
.jcard{background:var(--surf);border:2px solid var(--border);border-radius:22px;padding:26px;width:100%;max-width:360px;
  box-shadow:0 0 40px rgba(170,0,255,.25)}
.jcard h2{font-family:'Boogaloo',cursive;font-size:1.6rem;letter-spacing:.04em;margin-bottom:18px;text-align:center}
.field{margin-bottom:15px}
.field label{display:block;font-weight:900;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
.field input{width:100%;background:var(--surf2);border:2px solid var(--border);border-radius:11px;
  padding:13px 15px;color:#fff;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;transition:border-color .2s}
.field input:focus{outline:none;border-color:#aa00ff}
.btn-join{width:100%;padding:16px;border:none;border-radius:13px;font-family:'Boogaloo',cursive;font-size:1.3rem;
  letter-spacing:.05em;cursor:pointer;background:linear-gradient(135deg,#aa00ff,#2196f3);color:white;
  transition:all .2s;box-shadow:0 4px 20px rgba(170,0,255,.45)}
.btn-join:active{transform:scale(.97)}
.err{color:var(--red);font-size:.85rem;text-align:center;margin-top:8px;min-height:1.1em}

/* ── GAME ── */
#gameScreen{display:none;flex-direction:column;align-items:center;width:100%;height:100vh;
  padding:10px 14px 18px;gap:8px;overflow:hidden}
#gameScreen.active{display:flex}

/* Badge */
.badge{display:flex;align-items:center;gap:10px;padding:7px 18px;border-radius:999px;
  background:var(--surf);border:2px solid var(--border);transition:all .4s;flex-shrink:0}
.badge-dot{width:15px;height:15px;border-radius:50%}
.badge-name{font-family:'Boogaloo',cursive;font-size:1.15rem;letter-spacing:.04em}

/* Turn card */
.turn-card{width:100%;max-width:400px;padding:10px 16px;border-radius:16px;
  background:var(--surf);border:2px solid var(--border);text-align:center;transition:all .4s;flex-shrink:0}
.turn-card.my-turn{animation:turnPulse 1.2s ease infinite alternate}
@keyframes turnPulse{
  from{box-shadow:0 0 14px rgba(255,61,90,.3),0 0 0 0 rgba(255,61,90,.2)}
  to{box-shadow:0 0 32px rgba(255,61,90,.7),0 0 0 8px rgba(255,61,90,0)}
}
.tc-lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:900}
.tc-name{font-family:'Boogaloo',cursive;font-size:1.5rem;letter-spacing:.04em;line-height:1.2}
.tc-sub{font-size:.8rem;color:var(--dim)}

/* Play area */
.play-area{display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;max-width:440px;flex:1;min-height:0}

/* Dice column */
.dice-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;width:110px}

/* Big dice */
.dice-big{
  width:92px;height:92px;border-radius:18px;
  background:linear-gradient(145deg,#fff,#e0e0f0);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:6px;padding:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.9),inset 0 -2px 0 rgba(0,0,0,.1);
  transition:transform .1s;
  position:relative;
}
.dice-big.rolling{animation:diceRoll .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes diceRoll{
  0%{transform:rotate(0) scale(1)}
  15%{transform:rotate(-20deg) scale(1.15) translateY(-5px)}
  30%{transform:rotate(15deg) scale(.9) translateY(3px)}
  50%{transform:rotate(-10deg) scale(1.08) translateY(-3px)}
  70%{transform:rotate(6deg) scale(.96)}
  85%{transform:rotate(-3deg) scale(1.02)}
  100%{transform:rotate(0) scale(1)}
}
.dot{width:100%;height:100%;border-radius:50%;background:#1a0533;display:none}
.dot.v{display:block}
.dot.r{background:var(--red);box-shadow:0 0 4px var(--red)}
.dice-val{font-family:'Boogaloo',cursive;font-size:.95rem;color:var(--dim);text-align:center}

/* Roll button */
.btn-roll{
  width:100%;padding:13px 8px;border:none;border-radius:14px;
  font-family:'Boogaloo',cursive;font-size:1.15rem;letter-spacing:.05em;
  cursor:pointer;color:white;transition:all .15s;
  background:linear-gradient(135deg,#ff3d5a,#aa00ff);
  box-shadow:0 5px 18px rgba(255,61,90,.45);
}
.btn-roll:active:not(:disabled){transform:scale(.94)}
.btn-roll:disabled{opacity:.28;cursor:not-allowed;box-shadow:none}

/* Pick hint */
.pick-hint{font-size:.8rem;color:var(--dim);text-align:center;line-height:1.4}
.pick-hint strong{color:#ffd600;font-size:1rem}

/* Board col */
.board-col{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
#miniBoard{border-radius:14px;display:block;touch-action:none;
  box-shadow:0 0 24px rgba(170,0,255,.25),0 6px 20px rgba(0,0,0,.5)}
#miniBoard.hidden{display:none}

/* Wait block */
.wait-block{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.wait-block.hidden{display:none}
.spin-emoji{font-size:2.8rem;animation:spinFloat 2s ease infinite}
@keyframes spinFloat{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
.wt{font-family:'Boogaloo',cursive;font-size:1.25rem;letter-spacing:.04em}
.ws{color:var(--dim);font-size:.85rem}

/* Mini log */
.mini-log{width:100%;max-width:400px;flex-shrink:0}
.mle{font-size:.76rem;color:var(--dim);padding:3px 0;border-bottom:1px solid var(--border)}
.mle:first-child{color:#fff;font-weight:800}

/* Particle canvas */
#pCanvas{position:fixed;inset:0;pointer-events:none;z-index:100}
</style>
</head>
<body>
<canvas id="pCanvas"></canvas>

<!-- JOIN -->
<div id="joinScreen">
  <div class="logo"><h1>🎲 Ludo King</h1><p>Entra nella partita!</p></div>
  <div class="jcard">
    <h2>👤 Chi sei?</h2>
    <div class="field"><label>Il tuo nome</label><input id="nameInput" type="text" placeholder="Es: Marco" maxlength="16"/></div>
    <div class="field"><label>Server</label><input id="serverInput" type="text" placeholder="es: ludo.onrender.com"/></div>
    <button class="btn-join" onclick="doConnect()">🚀 Connettiti!</button>
    <p class="err" id="errMsg"></p>
  </div>
</div>

<!-- GAME -->
<div id="gameScreen">
  <div class="badge" id="badge"><div class="badge-dot" id="badgeDot"></div><span class="badge-name" id="badgeName">—</span></div>

  <div class="turn-card" id="turnCard">
    <div class="tc-lbl">Turno</div>
    <div class="tc-name" id="turnName">...</div>
    <div class="tc-sub" id="turnSub"></div>
  </div>

  <div class="play-area">
    <div class="dice-col">
      <div class="dice-big" id="diceFace">
        <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
        <div class="dot" id="d4"></div><div class="dot" id="d5"></div><div class="dot" id="d6"></div>
        <div class="dot" id="d7"></div><div class="dot" id="d8"></div><div class="dot" id="d9"></div>
      </div>
      <div class="dice-val" id="diceVal">—</div>
      <button class="btn-roll" id="rollBtn" onclick="doRoll()" disabled>🎲 Lancia!</button>
      <div class="pick-hint hidden" id="pickHint"></div>
    </div>

    <div class="board-col">
      <canvas id="miniBoard" class="hidden"></canvas>
      <div class="wait-block" id="waitBlock">
        <div class="spin-emoji">⏳</div>
        <div class="wt" id="waitName">In attesa...</div>
        <div class="ws" id="waitSub"></div>
      </div>
    </div>
  </div>

  <div class="mini-log" id="miniLog"></div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const CHX={red:'#ff3d5a',blue:'#2196f3',green:'#00c853',yellow:'#ffd600'};
const CHL={red:'#ff8fa3',blue:'#64b5f6',green:'#69f0ae',yellow:'#ffff52'};
const CHD={red:'#c0001a',blue:'#0d47a1',green:'#007b33',yellow:'#c7a500'};
const EMOJIS={red:'🔴',blue:'🔵',green:'🟢',yellow:'🟡'};
const START={red:0,blue:13,green:26,yellow:39};
const SAFE=[0,8,13,21,26,34,39,47];
const SEG={red:[0,1,2,3,4,5],blue:[13,14,15,16,17,18],green:[26,27,28,29,30,31],yellow:[39,40,41,42,43,44]};

function buildTrack(){const t=[];for(let c=0;c<=5;c++)t.push({r:6,c});for(let r=5;r>=0;r--)t.push({r,c:6});t.push({r:0,c:7});t.push({r:0,c:8});for(let r=1;r<=5;r++)t.push({r,c:8});for(let c=9;c<=14;c++)t.push({r:6,c});t.push({r:7,c:14});t.push({r:8,c:14});for(let c=13;c>=9;c--)t.push({r:8,c});for(let r=9;r<=14;r++)t.push({r,c:8});t.push({r:14,c:7});t.push({r:14,c:6});for(let r=13;r>=9;r--)t.push({r,c:6});for(let c=5;c>=0;c--)t.push({r:8,c});t.push({r:7,c:0});return t;}
const TRACK=buildTrack();
const STRETCH={
  red:   [{r:7,c:1},{r:7,c:2},{r:7,c:3},{r:7,c:4},{r:7,c:5},{r:7,c:6}],
  blue:  [{r:1,c:7},{r:2,c:7},{r:3,c:7},{r:4,c:7},{r:5,c:7},{r:6,c:7}],
  green: [{r:7,c:13},{r:7,c:12},{r:7,c:11},{r:7,c:10},{r:7,c:9},{r:7,c:8}],
  yellow:[{r:13,c:7},{r:12,c:7},{r:11,c:7},{r:10,c:7},{r:9,c:7},{r:8,c:7}],
};

let ws,gameState,myId,myColor,myName,S=0;
let particles=[];

// ── Connection ────────────────────────────────────────────────────────────────
function doConnect(){
  const name=document.getElementById('nameInput').value.trim()||'Giocatore';
  const server=document.getElementById('serverInput').value.trim();
  if(!server){setErr('Inserisci il server');return;}
  const h=server.replace(/^wss?:\/\//,'');
  const isLocal=/^(localhost|127\.|192\.168\.|10\.)/.test(h);
  const proto=isLocal?'ws':'wss';
  const cleanH=!isLocal?h.replace(/:3000$/,''):h;
  try{ws=new WebSocket(`${proto}://${cleanH}`);}catch{setErr('URL non valido');return;}
  ws.onopen=()=>ws.send(JSON.stringify({type:'join',name}));
  ws.onmessage=e=>handle(JSON.parse(e.data));
  ws.onerror=()=>setErr('Connessione fallita');
  ws.onclose=()=>{if(myColor)setErr('Disconnesso');};
  myName=name;
}
function handle(msg){
  if(msg.type==='hello'){myId=msg.id;if(msg.state)apply(msg.state);}
  else if(msg.type==='joined'){myColor=msg.color;myName=msg.name;showGame();}
  else if(msg.type==='state')apply(msg.state);
  else if(msg.type==='error')setErr(msg.message);
}
function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m));}
function doRoll(){
  send({type:'roll'});
  // Animate dice immediately for snappiness
  const face=document.getElementById('diceFace');
  face.classList.remove('rolling');void face.offsetWidth;face.classList.add('rolling');
  setTimeout(()=>face.classList.remove('rolling'),500);
}

function showGame(){
  document.getElementById('joinScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.add('active');
  updateBadge();
  setupBoard();
}
function updateBadge(){
  if(!myColor)return;
  document.getElementById('badgeDot').style.cssText=`background:${CHX[myColor]};box-shadow:0 0 12px ${CHX[myColor]}`;
  document.getElementById('badgeName').textContent=`${EMOJIS[myColor]} ${myName}`;
  document.getElementById('badge').style.borderColor=CHX[myColor];
}
function apply(s){
  gameState=s;
  if(!myColor&&myId){const me=s.players.find(p=>p.id===myId);if(me){myColor=me.color;myName=me.name;showGame();}}
  if(myColor)render();
}

// ── Render ────────────────────────────────────────────────────────────────────
let prevDice=null;
function render(){
  if(!gameState||!myColor)return;
  const isMyTurn=gameState.currentTurn===myColor;
  const needsMove=isMyTurn&&gameState.diceRolled&&gameState.movablePieces.length>0;
  const cur=gameState.players.find(p=>p.color===gameState.currentTurn);

  // Turn card
  const tc=document.getElementById('turnCard');
  if(isMyTurn){
    tc.classList.add('my-turn');
    tc.style.cssText=`background:${CHX[myColor]}22;border-color:${CHX[myColor]}`;
    document.getElementById('turnName').innerHTML=`<span style="color:${CHX[myColor]}">⚡ Tocca a te!</span>`;
    document.getElementById('turnSub').textContent='È il tuo momento!';
  } else {
    tc.classList.remove('my-turn');tc.style.cssText='';
    document.getElementById('turnName').textContent=cur?`${EMOJIS[cur.color]} ${cur.name}`:'...';
    document.getElementById('turnSub').textContent='Aspetta il tuo turno...';
  }

  // Dice animation on new value
  if(gameState.diceValue&&gameState.diceValue!==prevDice&&isMyTurn){
    const face=document.getElementById('diceFace');
    face.classList.remove('rolling');void face.offsetWidth;face.classList.add('rolling');
    setTimeout(()=>face.classList.remove('rolling'),500);
    if(gameState.diceValue===6) spawnStars();
    prevDice=gameState.diceValue;
  } else if(!gameState.diceValue){ prevDice=null; }

  // Dice dots
  if(gameState.diceValue){setDots(gameState.diceValue);document.getElementById('diceVal').textContent=`Fatto: ${gameState.diceValue}`;}
  else{clearDots();document.getElementById('diceVal').textContent='—';}

  // Buttons
  const btn=document.getElementById('rollBtn');
  const hint=document.getElementById('pickHint');
  hint.classList.add('hidden');

  if(gameState.phase==='lobby'){
    btn.disabled=true;btn.textContent='⏳ Lobby...';
  } else if(gameState.phase==='finished'){
    btn.disabled=true;btn.textContent='🏆 Fine!';
  } else if(!isMyTurn){
    btn.disabled=true;btn.textContent='🎲 Lancia!';
  } else if(!gameState.diceRolled){
    btn.disabled=false;btn.textContent='🎲 Lancia!';
  } else if(needsMove){
    btn.disabled=true;btn.textContent='👆 Scegli!';
    hint.classList.remove('hidden');
    hint.innerHTML=`Hai fatto <strong>${gameState.diceValue}</strong><br>tocca la tua pedina`;
  } else {
    btn.disabled=true;btn.textContent='⏳ Attesa...';
  }

  // Board vs waiting
  const board=document.getElementById('miniBoard');
  const wait=document.getElementById('waitBlock');
  if(gameState.phase==='lobby'){
    board.classList.add('hidden');wait.classList.remove('hidden');
    document.getElementById('waitName').textContent='Lobby';
    document.getElementById('waitSub').textContent=`${gameState.players.length}/4 connessi`;
  } else if(!isMyTurn){
    board.classList.add('hidden');wait.classList.remove('hidden');
    document.getElementById('waitName').textContent=cur?`${EMOJIS[cur.color]} ${cur.name}`:'...';
    document.getElementById('waitSub').textContent='sta giocando...';
  } else {
    board.classList.remove('hidden');wait.classList.add('hidden');
    drawMiniBoard();
  }

  // Log
  document.getElementById('miniLog').innerHTML=(gameState.log||[]).slice(0,3)
    .map(e=>`<div class="mle">${esc(e)}</div>`).join('');
}

// ── Stars on six ─────────────────────────────────────────────────────────────
function spawnStars(){
  const face=document.getElementById('diceFace');
  const r=face.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<20;i++){
    const a=Math.random()*Math.PI*2;
    const spd=3+Math.random()*5;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-3,
      life:1,decay:.025+Math.random()*.02,r:4+Math.random()*5,
      color:['#ffd600','#ff9800','#fff','#ffff52'][Math.floor(Math.random()*4)]});
  }
}

// ── Dice dots ─────────────────────────────────────────────────────────────────
const DP={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function setDots(v){clearDots();(DP[v]||[]).forEach(i=>{const d=document.getElementById(`d${i}`);d.classList.add('v');if(v===6)d.classList.add('r');});}
function clearDots(){for(let i=1;i<=9;i++){const d=document.getElementById(`d${i}`);d.classList.remove('v','r');}}

// ── Mini Board ────────────────────────────────────────────────────────────────
function setupBoard(){
  const col=document.getElementById('miniBoard').parentElement;
  const size=Math.min(col.clientWidth||180,window.innerHeight*.4,240);
  const canvas=document.getElementById('miniBoard');
  canvas.width=canvas.height=Math.floor(size);S=canvas.width/15;
}

function homePos(color,i){
  const b={red:[0,0],blue:[0,9],green:[9,9],yellow:[9,0]};
  const[br,bc]=b[color];const cx=(bc+3)*S,cy=(br+3)*S;
  const off=[[-1,-1],[1,-1],[-1,1],[1,1]];const[dr,dc]=off[i];
  return{x:cx+dc*S*.85,y:cy+dr*S*.85};
}

function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function drawMiniBoard(){
  const canvas=document.getElementById('miniBoard');
  if(!S||!gameState)return;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // BG
  ctx.fillStyle='#200a3a';rrect(ctx,0,0,S*15,S*15,14);ctx.fill();

  // Bases
  [{c:'red',r:0,col:0},{c:'blue',r:0,col:9},{c:'green',r:9,col:9},{c:'yellow',r:9,col:0}].forEach(({c,r,col})=>{
    const x=col*S,y=r*S,sz=6*S;
    ctx.fillStyle=CHX[c]+'22';rrect(ctx,x+1,y+1,sz-2,sz-2,10);ctx.fill();
    ctx.strokeStyle=CHX[c]+'66';ctx.lineWidth=1.5;rrect(ctx,x+1,y+1,sz-2,sz-2,10);ctx.stroke();
    const cx2=x+sz/2,cy2=y+sz/2;
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dr,dc])=>{
      ctx.fillStyle='#0f0525';ctx.beginPath();ctx.arc(cx2+dc*S*.85,cy2+dr*S*.85,S*.27,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=CHX[c]+'66';ctx.lineWidth=1;ctx.stroke();
    });
  });

  // Track
  TRACK.forEach((pos,i)=>{
    const{r,c}=pos;
    let fill='#2a0f48';
    for(const[col,idxs]of Object.entries(SEG)){if(idxs.includes(i)){fill=CHX[col];break;}}
    if(SAFE.includes(i))fill='#ffffff';
    ctx.fillStyle=fill+'aa';rrect(ctx,c*S+1,r*S+1,S-2,S-2,4);ctx.fill();
    if(SAFE.includes(i)){ctx.font=`${S*.38}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⭐',c*S+S/2,r*S+S/2);}
  });

  // Stretches
  Object.entries(STRETCH).forEach(([col,cells])=>{
    cells.forEach(({r,c},i)=>{
      const a=Math.round((0.18+i*.13)*255).toString(16).padStart(2,'0');
      ctx.fillStyle=CHX[col]+a;rrect(ctx,c*S+1,r*S+1,S-2,S-2,4);ctx.fill();
    });
  });

  // Center
  const ccx=7.5*S,ccy=7.5*S;
  [{c:'red',pts:[[1,7.5],[6,5],[6,10]]},{c:'blue',pts:[[7.5,1],[10,6],[5,6]]},
   {c:'green',pts:[[14,7.5],[9,10],[9,5]]},{c:'yellow',pts:[[7.5,14],[5,9],[10,9]]}]
  .forEach(({c,pts})=>{
    ctx.beginPath();ctx.moveTo(pts[0][0]*S,pts[0][1]*S);ctx.lineTo(pts[1][0]*S,pts[1][1]*S);ctx.lineTo(pts[2][0]*S,pts[2][1]*S);ctx.closePath();
    ctx.fillStyle=CHX[c]+'44';ctx.fill();
  });
  ctx.font=`${S*.7}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⭐',ccx,ccy);

  // Pieces
  const isMyTurn=gameState.currentTurn===myColor;
  const map={};
  ['red','blue','green','yellow'].forEach(color=>{
    if(!gameState.pieces[color]||!gameState.players.find(p=>p.color===color))return;
    gameState.pieces[color].forEach((piece,i)=>{
      if(piece.finished)return;
      let x,y,key;
      if(piece.trackPos===-1){const p=homePos(color,i);x=p.x;y=p.y;key=`h_${color}_${i}`;}
      else if(piece.homeStretchPos>=0){const cell=STRETCH[color][Math.min(piece.homeStretchPos,5)];if(!cell)return;x=cell.c*S+S/2;y=cell.r*S+S/2;key=`${cell.r}_${cell.c}`;}
      else{const ti=(START[color]+piece.trackPos)%52;const cell=TRACK[ti];if(!cell)return;x=cell.c*S+S/2;y=cell.r*S+S/2;key=`${cell.r}_${cell.c}`;}
      if(!map[key])map[key]=[];map[key].push({color,piece,x,y});
    });
  });
  Object.values(map).forEach(items=>{
    const n=items.length;
    items.forEach(({color,piece,x,y},idx)=>{
      let px=x,py=y;
      if(n>1){const a=(idx/n)*Math.PI*2-Math.PI/2;px+=Math.cos(a)*S*.17;py+=Math.sin(a)*S*.17;}
      const movable=isMyTurn&&gameState.diceRolled&&color===myColor&&gameState.movablePieces.includes(piece.id);
      const dimmed=isMyTurn&&gameState.diceRolled&&gameState.movablePieces.length>0&&!movable;
      const r=color===myColor?S*.32:S*.24;
      drawPiece(ctx,color,px,py,r,movable,dimmed);
    });
  });
}

function drawPiece(ctx,color,x,y,r,movable,dimmed){
  ctx.globalAlpha=dimmed?.3:1;
  if(movable){
    const t=(Date.now()/500)%1;
    ctx.beginPath();ctx.arc(x,y,r+3+t*4,0,Math.PI*2);
    ctx.strokeStyle=CHX[color]+Math.round((1-t)*200).toString(16).padStart(2,'0');
    ctx.lineWidth=2.5;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,r+1+(1-t)*4,0,Math.PI*2);
    ctx.strokeStyle=CHX[color]+Math.round(t*100).toString(16).padStart(2,'0');
    ctx.lineWidth=1.5;ctx.stroke();
    ctx.shadowColor=CHX[color];ctx.shadowBlur=10;
  }
  const g=ctx.createRadialGradient(x-r*.25,y-r*.28,r*.05,x+r*.05,y+r*.05,r*1.1);
  g.addColorStop(0,CHL[color]);g.addColorStop(.5,CHX[color]);g.addColorStop(1,CHD[color]);
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle=movable?'rgba(255,255,255,.95)':'rgba(255,255,255,.28)';ctx.lineWidth=movable?2:1;ctx.stroke();
  const sh=ctx.createRadialGradient(x-r*.28,y-r*.32,0,x-r*.28,y-r*.32,r*.55);
  sh.addColorStop(0,'rgba(255,255,255,.5)');sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sh;ctx.fill();
  ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.globalAlpha=1;
}

// ── Touch on board ────────────────────────────────────────────────────────────
document.getElementById('miniBoard').addEventListener('click',e=>{
  if(!gameState||gameState.phase!=='playing'||gameState.currentTurn!==myColor) return;
  if(!gameState.diceRolled||!gameState.movablePieces.length) return;
  const canvas=document.getElementById('miniBoard');
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.width/rect.width);
  const my=(e.clientY-rect.top)*(canvas.height/rect.height);
  let best=null,bestD=S*.6;
  for(const pid of gameState.movablePieces){
    const piece=gameState.pieces[myColor].find(p=>p.id===pid);if(!piece)continue;
    let px,py;
    if(piece.trackPos===-1){const p=homePos(myColor,pid);px=p.x;py=p.y;}
    else if(piece.homeStretchPos>=0){const cell=STRETCH[myColor][Math.min(piece.homeStretchPos,5)];if(!cell)continue;px=cell.c*S+S/2;py=cell.r*S+S/2;}
    else{const ti=(START[myColor]+piece.trackPos)%52;const cell=TRACK[ti];if(!cell)continue;px=cell.c*S+S/2;py=cell.r*S+S/2;}
    const d=Math.hypot(mx-px,my-py);if(d<bestD){bestD=d;best=pid;}
  }
  if(best!==null) send({type:'move',pieceId:best});
});

// ── Particle canvas loop ──────────────────────────────────────────────────────
function loopParticles(){
  const pc=document.getElementById('pCanvas');
  pc.width=window.innerWidth;pc.height=window.innerHeight;
  const ctx=pc.getContext('2d');
  ctx.clearRect(0,0,pc.width,pc.height);
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=p.decay;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.font=`${p.r*2}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('✨',p.x,p.y);
    ctx.globalAlpha=1;
  });
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(){
  if(gameState?.phase==='playing'&&gameState?.currentTurn===myColor){
    if(gameState.movablePieces.length||gameState.diceRolled) drawMiniBoard();
  }
  loopParticles();
  requestAnimationFrame(loop);
}

function setErr(msg){document.getElementById('errMsg').textContent=msg;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.addEventListener('load',()=>{
  const h=location.hostname||'localhost';
  const isLocal=/^(localhost|127\.|192\.168\.|10\.)/.test(h);
  document.getElementById('serverInput').value=isLocal?`${h}:${location.port||3000}`:h;
  document.getElementById('nameInput').focus();
});
window.addEventListener('resize',()=>{if(myColor)setupBoard();});
loop();
</script>
