<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 Ludo King 6</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ff3d5a;--red-l:#ff8fa3;--red-d:#c0001a;
  --blue:#2196f3;--blue-l:#64b5f6;--blue-d:#0d47a1;
  --green:#00c853;--green-l:#69f0ae;--green-d:#007b33;
  --yellow:#ffd600;--yellow-l:#ffff52;--yellow-d:#c7a500;
  --orange:#ff9100;--orange-l:#ffcc02;--orange-d:#e65100;
  --purple:#aa00ff;--purple-l:#e040fb;--purple-d:#6200ea;
  --bg:#0d0120;--surf:#1a0533;--surf2:#26084a;--border:#3a1065;--text:#fff;--dim:#b39ddb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
  background-image:
    radial-gradient(ellipse at 15% 15%,rgba(255,61,90,.12) 0,transparent 40%),
    radial-gradient(ellipse at 85% 15%,rgba(33,150,243,.12) 0,transparent 40%),
    radial-gradient(ellipse at 85% 85%,rgba(0,200,83,.12) 0,transparent 40%),
    radial-gradient(ellipse at 15% 85%,rgba(255,214,0,.1) 0,transparent 40%),
    radial-gradient(ellipse at 50% 50%,rgba(170,0,255,.08) 0,transparent 55%);
}
.topbar{
  display:flex;align-items:center;gap:14px;padding:6px 16px;flex-shrink:0;
  background:rgba(13,1,32,.85);border-bottom:2px solid var(--border);backdrop-filter:blur(10px);z-index:10;
}
.topbar h1{
  font-family:'Boogaloo',cursive;font-size:1.6rem;letter-spacing:.04em;
  background:linear-gradient(90deg,#ff3d5a,#ff9100,#ffd600,#00c853,#2196f3,#aa00ff,#ff3d5a);
  background-size:300%;animation:rainbowShift 5s linear infinite;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
@keyframes rainbowShift{0%{background-position:0%}100%{background-position:300%}}
.turn-pill{
  display:flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;
  font-family:'Boogaloo',cursive;font-size:1rem;letter-spacing:.04em;
  border:2px solid var(--border);background:var(--surf2);transition:all .4s;
}
.turn-dot{width:12px;height:12px;border-radius:50%;transition:all .3s}
.spacer{flex:1}
.url-hint{font-size:.74rem;color:var(--dim);text-align:right;line-height:1.6}
.url-hint strong{color:#ffd600}

.main{display:flex;flex:1;overflow:hidden;min-height:0}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-width:0;position:relative}
#boardCanvas{display:block;max-width:100%;max-height:100%;
  filter:drop-shadow(0 0 40px rgba(170,0,255,.3)) drop-shadow(0 0 80px rgba(0,0,0,.8))}

.sidebar{width:190px;flex-shrink:0;display:flex;flex-direction:column;gap:7px;padding:8px;overflow-y:auto;border-left:2px solid var(--border)}
.card{background:var(--surf);border:2px solid var(--border);border-radius:14px;padding:10px}
.card h3{font-family:'Boogaloo',cursive;font-size:.95rem;letter-spacing:.04em;color:var(--dim);margin-bottom:8px}

.dice-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.dice-s{width:50px;height:50px;border-radius:9px;background:#fff;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:3px;padding:7px;box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8)}
.dot{width:100%;height:100%;border-radius:50%;background:#1a0533;display:none}
.dot.v{display:block}.dot.r{background:var(--red)}
.dlabel{font-family:'Boogaloo',cursive;font-size:.85rem;color:var(--dim)}

.pitem{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:9px;margin-bottom:2px;transition:all .25s}
.pitem.active{background:rgba(255,255,255,.1);transform:translateX(3px)}
.pip{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pname{flex:1;font-weight:800;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pscore{font-size:.7rem;color:var(--dim)}
.sdot{width:5px;height:5px;border-radius:50%;background:#00c853;box-shadow:0 0 4px #00c853;flex-shrink:0}
.sdot.off{background:var(--red);box-shadow:0 0 4px var(--red)}

.log{max-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.loge{font-size:.7rem;color:var(--dim);padding:2px 0;border-bottom:1px solid var(--border)}
.loge:first-child{color:#fff;font-weight:800}

/* ── LOBBY OVERLAY ── */
#lobbyOverlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(5,0,15,.92);backdrop-filter:blur(14px)}
#lobbyOverlay.hidden{display:none}
.lcard{background:var(--surf);border:2px solid var(--border);border-radius:28px;padding:32px;max-width:520px;width:92%;text-align:center;
  box-shadow:0 0 70px rgba(170,0,255,.3)}
.lcard h2{font-family:'Boogaloo',cursive;font-size:2.2rem;letter-spacing:.04em;
  background:linear-gradient(90deg,#ff3d5a,#ff9100,#ffd600,#00c853,#2196f3,#aa00ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.lcard p{color:var(--dim);margin-bottom:20px;font-size:.9rem}
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.slot{padding:10px;border-radius:12px;border:2px solid var(--border);display:flex;align-items:center;gap:8px;transition:all .35s}
.slot.filled{border-color:rgba(255,255,255,.35);transform:scale(1.02)}
.sball{width:26px;height:26px;border-radius:50%;flex-shrink:0;transition:transform .3s}
.slot.filled .sball{animation:bounceBall .6s ease}
@keyframes bounceBall{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.slot.red    .sball{background:radial-gradient(circle at 35% 32%,#ff8fa3,#c0001a);box-shadow:0 0 12px var(--red)}
.slot.blue   .sball{background:radial-gradient(circle at 35% 32%,#64b5f6,#0d47a1);box-shadow:0 0 12px var(--blue)}
.slot.green  .sball{background:radial-gradient(circle at 35% 32%,#69f0ae,#007b33);box-shadow:0 0 12px var(--green)}
.slot.yellow .sball{background:radial-gradient(circle at 35% 32%,#ffff52,#c7a500);box-shadow:0 0 12px var(--yellow)}
.slot.orange .sball{background:radial-gradient(circle at 35% 32%,#ffcc02,#e65100);box-shadow:0 0 12px var(--orange)}
.slot.purple .sball{background:radial-gradient(circle at 35% 32%,#e040fb,#6200ea);box-shadow:0 0 12px var(--purple)}
.sinfo .sname{font-weight:900;font-size:.82rem}
.sinfo .stag{font-size:.67rem;color:var(--dim)}
.sinfo .sempty{color:var(--dim);font-style:italic;font-size:.75rem}
.btn-start{width:100%;padding:13px;border:none;border-radius:14px;font-family:'Boogaloo',cursive;font-size:1.3rem;
  letter-spacing:.06em;cursor:pointer;color:white;transition:all .2s;margin-bottom:10px;
  background:linear-gradient(135deg,#aa00ff,#2196f3);box-shadow:0 4px 24px rgba(170,0,255,.5)}
.btn-start:hover:not(:disabled){transform:translateY(-3px) scale(1.02);box-shadow:0 8px 32px rgba(170,0,255,.7)}
.btn-start:disabled{opacity:.3;cursor:not-allowed;transform:none}
.purl{padding:9px 12px;background:var(--surf2);border-radius:10px;font-size:.74rem;color:var(--dim);word-break:break-all}
.purl strong{color:#ffd600}

/* ── WINNER ── */
#winnerOverlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(5,0,15,.88);backdrop-filter:blur(16px)}
#winnerOverlay.hidden{display:none}
.wcard{background:var(--surf);border:3px solid var(--border);border-radius:28px;padding:44px;text-align:center;
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
@keyframes popIn{from{transform:scale(.4) rotate(-5deg);opacity:0}to{transform:scale(1);opacity:1}}
.wemoji{font-size:4.5rem;margin-bottom:10px;animation:trophyBounce 1s ease infinite alternate}
@keyframes trophyBounce{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-8px) rotate(5deg)}}
.wcard h2{font-family:'Boogaloo',cursive;font-size:2.6rem;margin-bottom:6px}
.wsub{margin-bottom:24px;font-size:1rem}
.wbtns{display:flex;gap:10px;justify-content:center}
.wbtn{padding:12px 24px;border:none;border-radius:12px;font-family:'Boogaloo',cursive;font-size:1.15rem;
  letter-spacing:.05em;cursor:pointer;transition:all .2s;color:#fff}
.wbtn:hover{transform:translateY(-2px) scale(1.05)}
.wbtn.g{background:linear-gradient(135deg,#00c853,#00bfa5)}
.wbtn.r{background:linear-gradient(135deg,#ff3d5a,#c0001a)}

/* ── REACTION OVERLAY ── */
#reactionLayer{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.reaction-bubble{
  position:absolute;bottom:20%;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  animation:reactionFloat 3.5s ease-in-out forwards;
  pointer-events:none;
}
@keyframes reactionFloat{
  0%{opacity:0;transform:translateY(0) scale(.4)}
  10%{opacity:1;transform:translateY(-20px) scale(1.2)}
  20%{transform:translateY(-30px) scale(1)}
  80%{opacity:1;transform:translateY(-120px) scale(1)}
  100%{opacity:0;transform:translateY(-180px) scale(.8)}
}
.reaction-emoji{font-size:3.5rem;filter:drop-shadow(0 4px 12px rgba(0,0,0,.7))}
.reaction-name{font-family:'Boogaloo',cursive;font-size:.8rem;padding:3px 10px;border-radius:999px;
  background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);white-space:nowrap}

#particleCanvas{position:fixed;inset:0;pointer-events:none;z-index:55}
</style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<div id="reactionLayer"></div>

<div class="topbar">
  <h1>🎲 Ludo King 6</h1>
  <div class="turn-pill" id="turnPill">
    <div class="turn-dot" id="turnDot" style="background:#555"></div>
    <span id="turnText">In attesa...</span>
  </div>
  <div class="spacer"></div>
  <div class="url-hint"><strong>📱 Giocatori:</strong><br><span id="playerUrl">...</span></div>
</div>

<div class="main">
  <div class="board-wrap"><canvas id="boardCanvas"></canvas></div>
  <div class="sidebar">
    <div class="card">
      <h3>🎲 Dado</h3>
      <div class="dice-wrap">
        <div class="dice-s" id="diceFace">
          <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
          <div class="dot" id="d4"></div><div class="dot" id="d5"></div><div class="dot" id="d6"></div>
          <div class="dot" id="d7"></div><div class="dot" id="d8"></div><div class="dot" id="d9"></div>
        </div>
        <div class="dlabel" id="diceLabel">—</div>
      </div>
    </div>
    <div class="card"><h3>👥 Giocatori</h3><div id="playersList"></div></div>
    <div class="card"><h3>📜 Log</h3><div class="log" id="logList"></div></div>
  </div>
</div>

<div id="lobbyOverlay">
  <div class="lcard">
    <h2>🎲 Ludo King 6</h2>
    <p>Da 2 a 6 giocatori • I giocatori si connettono da <strong style="color:#ffd600">/player</strong></p>
    <div class="slots" id="slotsGrid"></div>
    <button class="btn-start" id="startBtn" onclick="sendMsg({type:'start'})" disabled>▶ Inizia Partita!</button>
    <div class="purl">📱 Link giocatori: <strong id="playerUrlLobby">...</strong></div>
  </div>
</div>

<div id="winnerOverlay" class="hidden">
  <div class="wcard" id="winnerCard">
    <div class="wemoji" id="wEmoji">🏆</div>
    <h2 id="wTitle">Vittoria!</h2>
    <p class="wsub" id="wSub"></p>
    <div class="wbtns">
      <button class="wbtn g" onclick="sendMsg({type:'restart'})">🔄 Rivincita</button>
      <button class="wbtn r" onclick="sendMsg({type:'reset'})">🏠 Lobby</button>
    </div>
  </div>
</div>

<script>
// ── Color palette ──────────────────────────────────────────────────────────────
const CHX={red:'#ff3d5a',blue:'#2196f3',green:'#00c853',yellow:'#ffd600',orange:'#ff9100',purple:'#aa00ff'};
const CHL={red:'#ff8fa3',blue:'#64b5f6',green:'#69f0ae',yellow:'#ffff52',orange:'#ffcc02',purple:'#e040fb'};
const CHD={red:'#c0001a',blue:'#0d47a1',green:'#007b33',yellow:'#c7a500',orange:'#e65100',purple:'#6200ea'};
const EMOJIS={red:'🔴',blue:'🔵',green:'🟢',yellow:'🟡',orange:'🟠',purple:'🟣'};
const COLOR_NAMES={red:'Rosso',blue:'Blu',green:'Verde',yellow:'Giallo',orange:'Arancio',purple:'Viola'};
const COLORS=['red','blue','green','yellow','orange','purple'];

// ── Track size 54 (6 arms × 9 cells) ─────────────────────────────────────────
const TRACK_SIZE=54;
const START={red:0,blue:9,green:18,yellow:27,orange:36,purple:45};
const HOME_ENTRY={red:53,blue:8,green:17,yellow:26,orange:35,purple:44};
const SAFE=[0,4,9,13,18,22,27,31,36,40,45,49];

// ── Hexagonal board geometry ──────────────────────────────────────────────────
// The board is a regular hexagon drawn on a square canvas.
// 6 arms radiate from center. Each arm has:
//   - A base triangle (home zone) at the tip
//   - 9 track cells coming inward
//   - A home stretch (6 cells) going back to center
// We'll compute everything procedurally.

let W=0; // canvas size
const HEX_ARMS=6; // number of arms

// Returns absolute track cell {x,y} for global index i (0..53)
// Each group of 9 = one arm, arm angle = arm*60deg
function getTrackCell(i){
  const arm=Math.floor(i/9);
  const pos=i%9; // 0=outermost colored start, 8=innermost
  const angle=arm*(Math.PI*2/6)-Math.PI/2; // start at top
  const cx=W/2, cy=W/2;
  const outerR=W*.415;
  const innerR=W*.18;
  const t=pos/8; // 0=outer,1=inner
  const r=outerR*(1-t)+innerR*t;
  // Each arm has 3 columns (left, center, right) separated slightly
  // We use just center for now, offset left/right for the 3-lane track
  const col=(pos%3)-1; // -1,0,1
  const row=Math.floor(pos/3); // 0,1,2
  const radial=outerR*(1-(row/2.5));
  const perp=(W*.05)*col;
  const px=cx+Math.cos(angle)*radial+Math.cos(angle+Math.PI/2)*perp;
  const py=cy+Math.sin(angle)*radial+Math.sin(angle+Math.PI/2)*perp;
  return{x:px,y:py,arm,pos};
}

// Home stretch cells for each color (6 cells from entry toward center)
function getStretchCell(color, idx){
  const arm=COLORS.indexOf(color);
  const angle=arm*(Math.PI*2/6)-Math.PI/2;
  const cx=W/2, cy=W/2;
  const startR=W*.145;
  const endR=W*.04;
  const t=idx/5;
  const r=startR*(1-t)+endR*t;
  return{x:cx+Math.cos(angle)*r, y:cy+Math.sin(angle)*r};
}

// Home base center for each color
function getBaseCenter(color){
  const arm=COLORS.indexOf(color);
  const angle=arm*(Math.PI*2/6)-Math.PI/2;
  const cx=W/2,cy=W/2;
  const r=W*.47;
  return{x:cx+Math.cos(angle)*r, y:cy+Math.sin(angle)*r};
}

// 4 piece holes inside base
function getHolePos(color,i){
  const base=getBaseCenter(color);
  const arm=COLORS.indexOf(color);
  const angle=arm*(Math.PI*2/6)-Math.PI/2;
  // 2x2 grid, perpendicular to arm
  const dx=Math.cos(angle+Math.PI/2), dy=Math.sin(angle+Math.PI/2);
  const ax=Math.cos(angle), ay=Math.sin(angle);
  const cols=[-.5,.5];
  const rows=[-.5,.5];
  const col=cols[i%2], row=rows[Math.floor(i/2)];
  const spread=W*.045;
  return{
    x:base.x+dx*col*spread+ax*row*spread,
    y:base.y+dy*col*spread+ay*row*spread
  };
}

// ── Animation / rendering state ────────────────────────────────────────────────
let anims=[];
let particles=[];
let confetti=[];
let renderedPositions={};
let prevPieceState=null;
let ws,gameState,myId,S=0;

function pieceKey(color,id){return `${color}_${id}`;}

function getPiecePos(color,piece){
  if(piece.trackPos===-1){
    return getHolePos(color,piece.id);
  }
  if(piece.homeStretchPos>=0){
    return getStretchCell(color,Math.min(piece.homeStretchPos,5));
  }
  const ti=(START[color]+piece.trackPos)%TRACK_SIZE;
  return getTrackCell(ti);
}

// ── Connection ────────────────────────────────────────────────────────────────
function connect(){
  const h=location.hostname||'localhost';
  const isLocal=/^(localhost|127\.|192\.168\.|10\.)/.test(h);
  const proto=isLocal?'ws':'wss';
  const host=isLocal?`${h}:${location.port||3000}`:h;
  ws=new WebSocket(`${proto}://${host}`);
  ws.onopen=()=>ws.send(JSON.stringify({type:'register_display'}));
  ws.onmessage=e=>handle(JSON.parse(e.data));
  ws.onclose=()=>setTimeout(connect,1500);
}
function handle(msg){
  if(msg.type==='hello'){myId=msg.id;if(msg.state)apply(msg.state);}
  else if(msg.type==='state'){detectAnimations(msg.state);apply(msg.state);}
  else if(msg.type==='reaction'){showReaction(msg.reaction);}
}
function sendMsg(m){if(ws?.readyState===1)ws.send(JSON.stringify(m));}

// ── Reaction display ──────────────────────────────────────────────────────────
function showReaction(r){
  const layer=document.getElementById('reactionLayer');
  const el=document.createElement('div');
  el.className='reaction-bubble';
  // Random horizontal position
  const x=10+Math.random()*80;
  el.style.left=x+'%';
  el.innerHTML=`<div class="reaction-emoji">${r.emoji}</div>
    <div class="reaction-name" style="border-color:${CHX[r.color]||'rgba(255,255,255,.3)'}; color:${CHX[r.color]||'#fff'}">${esc(r.name)}</div>`;
  layer.appendChild(el);
  setTimeout(()=>el.remove(),3600);
}

// ── Animations ────────────────────────────────────────────────────────────────
function detectAnimations(newState){
  if(!prevPieceState||!W){prevPieceState=newState.pieces;return;}
  const oldMap={};
  COLORS.forEach(color=>{
    if(!prevPieceState[color])return;
    prevPieceState[color].forEach(p=>{oldMap[pieceKey(color,p.id)]={...p,color};});
  });
  COLORS.forEach(color=>{
    if(!newState.pieces[color])return;
    newState.pieces[color].forEach(np=>{
      const k=pieceKey(color,np.id);
      const op=oldMap[k];
      if(!op)return;
      const moved=(op.trackPos!==np.trackPos||op.homeStretchPos!==np.homeStretchPos);
      const captured=(np.trackPos===-1&&op.trackPos>=0);
      if(moved&&!captured){
        const from=renderedPositions[k]||getPiecePos(color,op);
        if(from)queueMove(k,color,np,from);
      }
      if(captured&&op.trackPos>=0){
        const pos=getTrackCell((START[color]+op.trackPos)%TRACK_SIZE);
        if(pos)spawnBurst(pos.x,pos.y,CHX[color]);
      }
    });
  });
  prevPieceState=JSON.parse(JSON.stringify(newState.pieces));
}
function queueMove(key,color,piece,from){
  anims=anims.filter(a=>a.key!==key);
  const to=getPiecePos(color,piece);
  anims.push({key,color,piece,fromX:from.x,fromY:from.y,x:to.x,y:to.y,progress:0,speed:.065});
}
function spawnBurst(x,y,color){
  for(let i=0;i<16;i++){
    const a=Math.random()*Math.PI*2;const spd=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,r:3+Math.random()*4,life:1,decay:.025+Math.random()*.02,color});
  }
}
function spawnConfetti(){
  const cols=[...Object.values(CHX),'#fff'];
  for(let i=0;i<140;i++){
    confetti.push({
      x:Math.random()*innerWidth,y:-10-Math.random()*100,
      vx:(Math.random()-.5)*4,vy:2+Math.random()*4,
      r:4+Math.random()*6,rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.2,
      life:1,decay:.004+Math.random()*.005,
      color:cols[Math.floor(Math.random()*cols.length)],
      shape:Math.random()>.5?'rect':'circle'
    });
  }
}

// ── State apply ───────────────────────────────────────────────────────────────
function apply(s){
  gameState=s;
  updateUrl();
  if(s.phase==='lobby'){
    document.getElementById('lobbyOverlay').classList.remove('hidden');
    renderSlots();
  } else {
    document.getElementById('lobbyOverlay').classList.add('hidden');
    renderSidebar();
  }
  if(s.phase==='finished'){
    showWinner();
    [200,600,1000,1400].forEach(d=>setTimeout(spawnConfetti,d));
  } else {
    document.getElementById('winnerOverlay').classList.add('hidden');
  }
  if(!prevPieceState)prevPieceState=JSON.parse(JSON.stringify(s.pieces));
}
function updateUrl(){
  const h=location.hostname||'localhost';
  const isLocal=/^(localhost|127\.|192\.168\.|10\.)/.test(h);
  const url=isLocal?`${h}:${location.port||3000}/player`:`${h}/player`;
  document.getElementById('playerUrl').textContent=url;
  document.getElementById('playerUrlLobby').textContent=url;
}

// ── Lobby ─────────────────────────────────────────────────────────────────────
function renderSlots(){
  document.getElementById('slotsGrid').innerHTML=COLORS.map(color=>{
    const p=gameState.players.find(pl=>pl.color===color);
    return`<div class="slot ${color} ${p?'filled':''}">
      <div class="sball"></div>
      <div class="sinfo">${p
        ?`<div class="sname">${esc(p.name)}</div><div class="stag">${EMOJIS[color]} ${COLOR_NAMES[color]}</div>`
        :`<div class="sempty">Libero...</div><div class="stag">${EMOJIS[color]} ${COLOR_NAMES[color]}</div>`
      }</div></div>`;
  }).join('');
  document.getElementById('startBtn').disabled=gameState.players.length<2;
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar(){
  const color=gameState.currentTurn;
  if(color){
    const p=gameState.players.find(pl=>pl.color===color);
    document.getElementById('turnDot').style.cssText=`background:${CHX[color]};box-shadow:0 0 10px ${CHX[color]}`;
    document.getElementById('turnText').textContent=`${p?.name||color}`;
    document.getElementById('turnPill').style.cssText=`border-color:${CHX[color]};background:${CHX[color]}22`;
  }
  if(gameState.diceValue)showDice(gameState.diceValue);
  else{clearDots();document.getElementById('diceLabel').textContent='—';}
  document.getElementById('playersList').innerHTML=gameState.players.map(p=>{
    const fin=gameState.pieces[p.color].filter(pc=>pc.finished).length;
    return`<div class="pitem ${gameState.currentTurn===p.color?'active':''}">
      <div class="sdot ${p.connected?'':'off'}"></div>
      <div class="pip" style="background:${CHX[p.color]};box-shadow:0 0 5px ${CHX[p.color]}"></div>
      <span class="pname">${esc(p.name)}</span>
      <span class="pscore">${fin}/4</span>
      ${gameState.currentTurn===p.color?`<span style="color:${CHX[p.color]}">▶</span>`:''}
    </div>`;
  }).join('');
  document.getElementById('logList').innerHTML=(gameState.log||[]).slice(0,20)
    .map(e=>`<div class="loge">${esc(e)}</div>`).join('');
}

const DICE_P={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function showDice(v){clearDots();(DICE_P[v]||[]).forEach(i=>{const d=document.getElementById(`d${i}`);d.classList.add('v');if(v===6)d.classList.add('r');});document.getElementById('diceLabel').textContent=`Uscito: ${v}`;}
function clearDots(){for(let i=1;i<=9;i++){const d=document.getElementById(`d${i}`);d.classList.remove('v','r');}}

// ── Winner ────────────────────────────────────────────────────────────────────
function showWinner(){
  const c=gameState.winner;
  const p=gameState.players.find(pl=>pl.color===c);
  document.getElementById('wEmoji').textContent=EMOJIS[c]||'🏆';
  document.getElementById('wTitle').textContent=`${p?.name||c} ha vinto!`;
  document.getElementById('wTitle').style.color=CHX[c]||'#fff';
  document.getElementById('wSub').textContent='Partita incredibile! 🎉';
  document.getElementById('winnerCard').style.borderColor=CHX[c]||'';
  document.getElementById('winnerOverlay').classList.remove('hidden');
}

// ── Canvas resize ─────────────────────────────────────────────────────────────
function resizeIfNeeded(){
  const canvas=document.getElementById('boardCanvas');
  const wrap=canvas.parentElement;
  const size=Math.floor(Math.min(wrap.clientWidth-16,wrap.clientHeight-16));
  if(Math.abs(canvas.width-size)>2){
    canvas.width=canvas.height=size;
    W=size;
    renderedPositions={};
  }
}

// ── BOARD DRAWING ─────────────────────────────────────────────────────────────
function drawBoard(ctx){
  if(!W)return;
  const cx=W/2,cy=W/2;

  // Hexagonal background
  ctx.save();
  ctx.fillStyle='#120030';
  hexPath(ctx,cx,cy,W*.5);ctx.fill();
  ctx.strokeStyle='rgba(170,0,255,.25)';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();

  // Subtle radial glow
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,W*.5);
  bg.addColorStop(0,'rgba(80,0,160,.25)');bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;hexPath(ctx,cx,cy,W*.5);ctx.fill();

  // Draw 6 arm bases (home zones)
  COLORS.forEach(color=>{
    drawBase(ctx,color);
  });

  // Draw track cells (54 cells)
  for(let i=0;i<TRACK_SIZE;i++){
    drawTrackCell(ctx,i);
  }

  // Draw home stretches
  COLORS.forEach(color=>{
    drawHomeStretch(ctx,color);
  });

  // Center hexagon (finish zone)
  drawCenter(ctx,cx,cy);
}

function hexPath(ctx,cx,cy,r,rotate=0){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3+rotate;
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
}

function drawBase(ctx,color){
  const arm=COLORS.indexOf(color);
  const angle=arm*(Math.PI*2/6)-Math.PI/2;
  const base=getBaseCenter(color);
  const cx=W/2,cy=W/2;

  // Big triangular zone toward tip
  const tipR=W*.495;
  const tipX=cx+Math.cos(angle)*tipR, tipY=cy+Math.sin(angle)*tipR;
  const sideR=W*.28;
  const sideA1=angle+Math.PI/6*1.8, sideA2=angle-Math.PI/6*1.8;
  const s1x=cx+Math.cos(sideA1)*sideR, s1y=cy+Math.sin(sideA1)*sideR;
  const s2x=cx+Math.cos(sideA2)*sideR, s2y=cy+Math.sin(sideA2)*sideR;

  ctx.beginPath();
  ctx.moveTo(tipX,tipY);ctx.lineTo(s1x,s1y);ctx.lineTo(s2x,s2y);ctx.closePath();
  const g=ctx.createRadialGradient(base.x,base.y,0,base.x,base.y,W*.15);
  g.addColorStop(0,CHX[color]+'44');g.addColorStop(1,CHX[color]+'0a');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle=CHX[color]+'66';ctx.lineWidth=2;ctx.stroke();

  // Inner circle hint
  ctx.beginPath();ctx.arc(base.x,base.y,W*.07,0,Math.PI*2);
  ctx.strokeStyle=CHX[color]+'33';ctx.lineWidth=1.5;ctx.stroke();

  // 4 piece holes
  for(let i=0;i<4;i++){
    const h=getHolePos(color,i);
    const hr=W*.028;
    ctx.beginPath();ctx.arc(h.x,h.y,hr,0,Math.PI*2);
    ctx.fillStyle='#050010';ctx.fill();
    ctx.strokeStyle=CHX[color]+'aa';ctx.lineWidth=1.5;ctx.stroke();
    // shine
    ctx.beginPath();ctx.arc(h.x-hr*.2,h.y-hr*.2,hr*.38,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.07)';ctx.fill();
  }

  // Color label dot
  ctx.fillStyle=CHX[color];
  ctx.beginPath();ctx.arc(base.x,base.y,W*.012,0,Math.PI*2);ctx.fill();
}

function drawTrackCell(ctx,i){
  const cell=getTrackCell(i);
  const arm=Math.floor(i/9);
  const pos=i%9;
  const color=COLORS[arm];
  const r=W*.023;

  // Color: first 2 cells of each arm are colored (start zone), safe cells are white
  let fill;
  if(SAFE.includes(i))fill='#ffffff';
  else if(pos<2)fill=CHX[color];
  else fill='#2a0f48';

  ctx.beginPath();ctx.arc(cell.x,cell.y,r,0,Math.PI*2);
  ctx.fillStyle=fill+'cc';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.stroke();

  if(SAFE.includes(i)){
    ctx.font=`${r*1.2}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⭐',cell.x,cell.y);
  }
}

function drawHomeStretch(ctx,color){
  const arm=COLORS.indexOf(color);
  const angle=arm*(Math.PI*2/6)-Math.PI/2;
  for(let i=0;i<6;i++){
    const cell=getStretchCell(color,i);
    const alpha=0.2+i*.13;
    const r=W*.019;
    ctx.beginPath();ctx.arc(cell.x,cell.y,r,0,Math.PI*2);
    ctx.fillStyle=CHX[color]+Math.round(alpha*255).toString(16).padStart(2,'0');
    ctx.fill();
    ctx.strokeStyle=CHX[color]+'44';ctx.lineWidth=1;ctx.stroke();
    if(i===5){
      ctx.font=`${r*1.5}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🏠',cell.x,cell.y);
    }
  }
}

function drawCenter(ctx,cx,cy){
  // Draw a small hexagon in the center with a star
  const r=W*.072;
  ctx.save();
  hexPath(ctx,cx,cy,r,Math.PI/6);
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,.02)');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
  ctx.font=`${r*.9}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('⭐',cx,cy);
}

// ── PIECES DRAWING ────────────────────────────────────────────────────────────
function drawPieces(ctx){
  if(!gameState||!W)return;
  const animKeys=new Set(anims.map(a=>a.key));
  const map={};

  COLORS.forEach(color=>{
    if(!gameState.pieces[color]||!gameState.players.find(p=>p.color===color))return;
    gameState.pieces[color].forEach(piece=>{
      if(piece.finished)return;
      const k=pieceKey(color,piece.id);
      if(animKeys.has(k))return;
      const pos=getPiecePos(color,piece);
      if(!pos)return;
      const key2=`${Math.round(pos.x)}_${Math.round(pos.y)}`;
      if(!map[key2])map[key2]=[];
      map[key2].push({color,piece,pos,k});
    });
  });

  Object.values(map).forEach(items=>{
    const n=items.length;
    items.forEach(({color,piece,pos,k},idx)=>{
      let px=pos.x,py=pos.y;
      if(n>1){const a=(idx/n)*Math.PI*2-Math.PI/2;px+=Math.cos(a)*W*.018;py+=Math.sin(a)*W*.018;}
      renderedPositions[k]={x:px,y:py};
      const movable=gameState.currentTurn===color&&gameState.movablePieces.includes(piece.id);
      drawPiece(ctx,color,px,py,W*.026,movable,false);
    });
  });

  // Animated pieces
  anims.forEach(a=>{
    const t=ease(a.progress);
    const px=a.fromX+(a.x-a.fromX)*t;
    const py=a.fromY+(a.y-a.fromY)*t;
    const arc=Math.sin(a.progress*Math.PI)*W*.03;
    renderedPositions[a.key]={x:px,y:py};
    drawPiece(ctx,a.color,px,py-arc,W*.028,false,true);
  });
}

function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

function drawPiece(ctx,color,x,y,r,movable,anim){
  if(movable){
    const t=(Date.now()/600)%1;
    ctx.beginPath();ctx.arc(x,y,r+3+t*5,0,Math.PI*2);
    ctx.strokeStyle=CHX[color]+Math.round((1-t)*200).toString(16).padStart(2,'0');
    ctx.lineWidth=2.5;ctx.stroke();
  }
  ctx.shadowColor=anim?'#fff':(movable?CHX[color]:'rgba(0,0,0,.4)');
  ctx.shadowBlur=anim?14:(movable?12:5);
  const g=ctx.createRadialGradient(x-r*.28,y-r*.3,r*.05,x+r*.05,y+r*.05,r*1.1);
  g.addColorStop(0,CHL[color]);g.addColorStop(.5,CHX[color]);g.addColorStop(1,CHD[color]);
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle=movable?'rgba(255,255,255,.9)':'rgba(255,255,255,.3)';
  ctx.lineWidth=movable?2:1.2;ctx.stroke();
  const shine=ctx.createRadialGradient(x-r*.3,y-r*.35,0,x-r*.3,y-r*.35,r*.5);
  shine.addColorStop(0,'rgba(255,255,255,.5)');shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=shine;ctx.fill();
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
}

// ── Particle canvas ───────────────────────────────────────────────────────────
function updateParticles(){
  const pc=document.getElementById('particleCanvas');
  pc.width=innerWidth;pc.height=innerHeight;
  const ctx=pc.getContext('2d');ctx.clearRect(0,0,pc.width,pc.height);
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=p.decay;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  });
  confetti=confetti.filter(c=>c.life>0);
  confetti.forEach(c=>{
    c.x+=c.vx;c.y+=c.vy;c.rot+=c.rotV;c.life-=c.decay;c.vy+=.04;
    ctx.globalAlpha=c.life;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.fillStyle=c.color;
    if(c.shape==='rect'){ctx.fillRect(-c.r/2,-c.r/4,c.r,c.r/2);}
    else{ctx.beginPath();ctx.arc(0,0,c.r/2,0,Math.PI*2);ctx.fill();}
    ctx.restore();ctx.globalAlpha=1;
  });
}

// ── Click on board ────────────────────────────────────────────────────────────
document.getElementById('boardCanvas').addEventListener('click',e=>{
  if(!gameState||gameState.phase!=='playing'||!gameState.movablePieces.length)return;
  const canvas=document.getElementById('boardCanvas');
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.width/rect.width);
  const my=(e.clientY-rect.top)*(canvas.height/rect.height);
  const color=gameState.currentTurn;
  let best=null,bestD=W*.06;
  for(const pid of gameState.movablePieces){
    const piece=gameState.pieces[color].find(p=>p.id===pid);if(!piece)continue;
    const rp=renderedPositions[pieceKey(color,pid)];
    if(!rp)continue;
    const d=Math.hypot(mx-rp.x,my-rp.y);
    if(d<bestD){bestD=d;best=pid;}
  }
  if(best!==null)sendMsg({type:'move',pieceId:best});
});

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(){
  resizeIfNeeded();
  if(gameState?.phase==='playing'||gameState?.phase==='finished'){
    const canvas=document.getElementById('boardCanvas');
    if(W&&canvas.width>0){
      const ctx=canvas.getContext('2d');
      ctx.clearRect(0,0,W,W);
      drawBoard(ctx);
      drawPieces(ctx);
    }
  }
  anims=anims.filter(a=>{a.progress+=a.speed;return a.progress<1;});
  updateParticles();
  requestAnimationFrame(loop);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
window.addEventListener('resize',()=>{W=0;renderedPositions={};});
connect();loop();
</script>
