<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 Ludo King — Display</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#e63946;--red-l:#ff8a94;--red-d:#b71c1c;--blue:#1d6fa5;--blue-l:#4fc3f7;--blue-d:#0d47a1;--green:#2a9d56;--green-l:#69d98c;--green-d:#1b5e20;--yellow:#e9c46a;--yellow-l:#fff59d;--yellow-d:#f9a825;--bg:#0b0a14;--surf:#16152a;--surf2:#1f1e35;--border:#2a2844;--text:#f0eeff;--dim:#7b79a0}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;background-image:radial-gradient(ellipse at 15% 15%,rgba(90,50,200,.18) 0,transparent 55%),radial-gradient(ellipse at 85% 85%,rgba(20,90,200,.14) 0,transparent 55%)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(22,21,42,.9);border-bottom:1px solid var(--border);backdrop-filter:blur(8px);flex-shrink:0}
.topbar h1{font-family:'Fredoka One',cursive;font-size:1.5rem;background:linear-gradient(120deg,#f72585,#7209b7,#3a86ff,#06d6a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.turn-pill{display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:var(--surf2);border:1px solid var(--border);font-family:'Fredoka One',cursive;font-size:1rem;transition:all .3s}
.turn-dot{width:12px;height:12px;border-radius:50%}.spacer{flex:1}
.qr-hint{font-size:.8rem;color:var(--dim);text-align:right;line-height:1.5}.qr-hint strong{color:var(--text)}
.main{display:flex;flex:1;overflow:hidden;min-height:0}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-width:0}
#boardCanvas{border-radius:18px;box-shadow:0 0 60px rgba(114,9,183,.25),0 20px 50px rgba(0,0,0,.6);display:block;max-width:100%;max-height:100%}
.sidebar{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding:14px;overflow-y:auto;border-left:1px solid var(--border)}
.card{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:14px}
.card h3{font-family:'Fredoka One',cursive;font-size:.9rem;color:var(--dim);margin-bottom:10px}
.pitem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;margin-bottom:4px;transition:background .2s}
.pitem.active{background:rgba(255,255,255,.07)}
.pip{width:10px;height:10px;border-radius:50%;flex-shrink:0}.pname{flex:1;font-weight:700;font-size:.85rem}.pscore{font-size:.75rem;color:var(--dim)}
.sdot{width:6px;height:6px;border-radius:50%;background:#2a9d56;box-shadow:0 0 5px #2a9d56;flex-shrink:0}.sdot.off{background:var(--red);box-shadow:0 0 5px var(--red)}
.dice-display{display:flex;flex-direction:column;align-items:center;gap:8px}
.dice-face{width:60px;height:60px;border-radius:11px;background:white;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.8)}
.dot{width:100%;height:100%;border-radius:50%;background:#222;display:none}.dot.v{display:block}.dot.r{background:var(--red)}
.dice-label{font-size:.82rem;color:var(--dim);font-weight:700}
.log{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.log-e{font-size:.76rem;color:var(--dim);padding:3px 0;border-bottom:1px solid var(--border)}.log-e:first-child{color:var(--text);font-weight:700}
#lobbyOverlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(11,10,20,.92);backdrop-filter:blur(10px)}
#lobbyOverlay.hidden{display:none}
.lobby-card{background:var(--surf);border:1px solid var(--border);border-radius:24px;padding:40px;max-width:520px;width:90%;text-align:center}
.lobby-card h2{font-family:'Fredoka One',cursive;font-size:2rem;margin-bottom:6px}.lobby-sub{color:var(--dim);margin-bottom:28px;font-size:.95rem}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.slot{padding:14px;border-radius:14px;border:2px solid var(--border);display:flex;align-items:center;gap:10px;transition:all .3s}.slot.filled{border-color:rgba(255,255,255,.25)}
.slot-ball{width:30px;height:30px;border-radius:50%;flex-shrink:0}
.slot.red .slot-ball{background:radial-gradient(circle at 35% 35%,var(--red-l),var(--red-d));box-shadow:0 0 10px var(--red)}
.slot.blue .slot-ball{background:radial-gradient(circle at 35% 35%,var(--blue-l),var(--blue-d));box-shadow:0 0 10px var(--blue)}
.slot.green .slot-ball{background:radial-gradient(circle at 35% 35%,var(--green-l),var(--green-d));box-shadow:0 0 10px var(--green)}
.slot.yellow .slot-ball{background:radial-gradient(circle at 35% 35%,var(--yellow-l),var(--yellow-d));box-shadow:0 0 10px var(--yellow)}
.slot-info .sname{font-weight:800;font-size:.92rem}.slot-info .stag{font-size:.73rem;color:var(--dim)}.slot-info .sempty{color:var(--dim);font-style:italic;font-size:.85rem}
.btn-start{width:100%;padding:15px;border:none;border-radius:14px;font-family:'Fredoka One',cursive;font-size:1.25rem;cursor:pointer;background:linear-gradient(135deg,#7209b7,#3a86ff);color:white;transition:all .2s;box-shadow:0 4px 20px rgba(114,9,183,.4);margin-bottom:14px}
.btn-start:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(114,9,183,.6)}.btn-start:disabled{opacity:.35;cursor:not-allowed;transform:none}
.player-url{padding:11px 14px;background:var(--surf2);border-radius:10px;font-size:.8rem;color:var(--dim);word-break:break-all}.player-url strong{color:var(--text)}
#winnerOverlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(11,10,20,.88);backdrop-filter:blur(12px)}
#winnerOverlay.hidden{display:none}
.winner-card{background:var(--surf);border:1px solid var(--border);border-radius:28px;padding:52px;text-align:center;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.w-emoji{font-size:5rem;margin-bottom:16px}.winner-card h2{font-family:'Fredoka One',cursive;font-size:2.5rem;margin-bottom:8px}.winner-card p{color:var(--dim);margin-bottom:32px;font-size:1.1rem}
.w-btns{display:flex;gap:12px;justify-content:center}
.wbtn{padding:14px 28px;border:none;border-radius:12px;font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;transition:all .2s}.wbtn:hover{transform:translateY(-2px)}
.wbtn.green{background:linear-gradient(135deg,#2a9d56,#06d6a0);color:#fff}.wbtn.red{background:linear-gradient(135deg,#e63946,#c1121f);color:#fff}
</style>
</head>
<body>
<div class="topbar">
  <h1>🎲 Ludo King</h1>
  <div class="turn-pill" id="turnPill"><div class="turn-dot" id="turnDot" style="background:#444"></div><span id="turnText">In attesa...</span></div>
  <div class="spacer"></div>
  <div class="qr-hint"><strong>📱 Giocatori aprono:</strong><br><span id="playerUrl">...</span></div>
</div>
<div class="main">
  <div class="board-wrap"><canvas id="boardCanvas"></canvas></div>
  <div class="sidebar">
    <div class="card"><h3>🎲 Ultimo dado</h3><div class="dice-display">
      <div class="dice-face" id="diceFace">
        <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
        <div class="dot" id="d4"></div><div class="dot" id="d5"></div><div class="dot" id="d6"></div>
        <div class="dot" id="d7"></div><div class="dot" id="d8"></div><div class="dot" id="d9"></div>
      </div>
      <div class="dice-label" id="diceLabel">—</div>
    </div></div>
    <div class="card"><h3>👥 Giocatori</h3><div id="playersList"></div></div>
    <div class="card"><h3>📜 Registro</h3><div class="log" id="logList"></div></div>
  </div>
</div>
<div id="lobbyOverlay">
  <div class="lobby-card">
    <h2>🎮 Lobby</h2>
    <p class="lobby-sub">I giocatori si connettono con il telefono alla pagina <strong>/player</strong></p>
    <div class="slots" id="slotsGrid"></div>
    <button class="btn-start" id="startBtn" onclick="sendMsg({type:'start'})" disabled>Inizia Partita ▶</button>
    <div class="player-url">📱 I giocatori aprono: <strong id="playerUrlLobby">...</strong></div>
  </div>
</div>
<div id="winnerOverlay" class="hidden">
  <div class="winner-card">
    <div class="w-emoji" id="wEmoji">🏆</div><h2 id="wTitle">Vittoria!</h2><p id="wSub"></p>
    <div class="w-btns">
      <button class="wbtn green" onclick="sendMsg({type:'restart'})">Rivincita 🔄</button>
      <button class="wbtn red" onclick="sendMsg({type:'reset'})">Lobby 🏠</button>
    </div>
  </div>
</div>
<script>
const CHX={red:'#e63946',blue:'#1d6fa5',green:'#2a9d56',yellow:'#e9c46a'};
const CHL={red:'#ff8a94',blue:'#4fc3f7',green:'#69d98c',yellow:'#fff59d'};
const START={red:0,blue:13,green:26,yellow:39};
const HOME_ENTRY={red:50,blue:11,green:24,yellow:37};
const SAFE=[0,8,13,21,26,34,39,47];
const SEG={red:[0,1,2,3,4,5],blue:[13,14,15,16,17,18],green:[26,27,28,29,30,31],yellow:[39,40,41,42,43,44]};

function buildTrack(){const t=[];for(let c=0;c<=5;c++)t.push({r:6,c});for(let r=5;r>=0;r--)t.push({r,c:6});t.push({r:0,c:7});t.push({r:0,c:8});for(let r=1;r<=5;r++)t.push({r,c:8});for(let c=9;c<=14;c++)t.push({r:6,c});t.push({r:7,c:14});t.push({r:8,c:14});for(let c=13;c>=9;c--)t.push({r:8,c});for(let r=9;r<=14;r++)t.push({r,c:8});t.push({r:14,c:7});t.push({r:14,c:6});for(let r=13;r>=9;r--)t.push({r,c:6});for(let c=5;c>=0;c--)t.push({r:8,c});t.push({r:7,c:0});return t;}
const TRACK=buildTrack();
const STRETCH={red:[{r:7,c:1},{r:7,c:2},{r:7,c:3},{r:7,c:4},{r:7,c:5},{r:7,c:6}],blue:[{r:1,c:7},{r:2,c:7},{r:3,c:7},{r:4,c:7},{r:5,c:7},{r:6,c:7}],green:[{r:7,c:13},{r:7,c:12},{r:7,c:11},{r:7,c:10},{r:7,c:9},{r:7,c:8}],yellow:[{r:13,c:7},{r:12,c:7},{r:11,c:7},{r:10,c:7},{r:9,c:7},{r:8,c:7}]};

let ws,gameState,myId,S=0;

function connect(){
  const h=location.hostname||'localhost';
  const isLocal=/^(localhost|127\.|192\.168\.|10\.)/.test(h);
  const proto=isLocal?'ws':'wss';
  const host=isLocal?`${h}:${location.port||3000}`:h;
  ws=new WebSocket(`${proto}://${host}`);
  ws.onopen=()=>ws.send(JSON.stringify({type:'register_display'}));
  ws.onmessage=e=>handle(JSON.parse(e.data));
  ws.onclose=()=>setTimeout(connect,1500);
}
function handle(msg){if(msg.type==='hello'){myId=msg.id;if(msg.state)apply(msg.state);}else if(msg.type==='state')apply(msg.state);}
function sendMsg(m){if(ws?.readyState===1)ws.send(JSON.stringify(m));}

function apply(s){
  gameState=s;
  const h=location.hostname||'localhost';
  const isLocal=/^(localhost|127\.|192\.168\.|10\.)/.test(h);
  const url=isLocal?`${h}:${location.port||3000}/player`:`${h}/player`;
  document.getElementById('playerUrl').textContent=url;
  document.getElementById('playerUrlLobby').textContent=url;
  if(s.phase==='lobby'){document.getElementById('lobbyOverlay').classList.remove('hidden');renderSlots();}
  else{document.getElementById('lobbyOverlay').classList.add('hidden');drawAll();}
  if(s.phase==='finished')showWinner();else document.getElementById('winnerOverlay').classList.add('hidden');
}

function renderSlots(){
  const cols=['red','blue','green','yellow'],names={red:'Rosso',blue:'Blu',green:'Verde',yellow:'Giallo'},em={red:'🔴',blue:'🔵',green:'🟢',yellow:'🟡'};
  document.getElementById('slotsGrid').innerHTML=cols.map(color=>{
    const p=gameState.players.find(pl=>pl.color===color);
    return`<div class="slot ${color} ${p?'filled':''}"><div class="slot-ball"></div><div class="slot-info">${p?`<div class="sname">${esc(p.name)}</div><div class="stag">${em[color]} ${names[color]}</div>`:`<div class="sempty">In attesa...</div><div class="stag">${em[color]} ${names[color]}</div>`}</div></div>`;
  }).join('');
  document.getElementById('startBtn').disabled=gameState.players.length<1;
}

function drawAll(){resizeIfNeeded();renderSidebar();renderBoard();}

function resizeIfNeeded(){
  const canvas=document.getElementById('boardCanvas');
  const wrap=canvas.parentElement;
  const size=Math.min(wrap.clientWidth-24,wrap.clientHeight-24);
  if(canvas.width!==size){canvas.width=canvas.height=size;S=size/15;}
}

function renderSidebar(){
  const color=gameState.currentTurn,p=color&&gameState.players.find(pl=>pl.color===color);
  if(color){document.getElementById('turnDot').style.cssText=`background:${CHX[color]};box-shadow:0 0 8px ${CHX[color]}`;document.getElementById('turnText').textContent=`Turno di ${p?.name||color}`;document.getElementById('turnPill').style.borderColor=CHX[color];}
  if(gameState.diceValue)updateDice(gameState.diceValue);else{document.getElementById('diceLabel').textContent='—';for(let i=1;i<=9;i++){const d=document.getElementById(`d${i}`);d.classList.remove('v','r');}}
  document.getElementById('playersList').innerHTML=gameState.players.map(p=>{
    const fin=gameState.pieces[p.color].filter(pc=>pc.finished).length;
    return`<div class="pitem ${gameState.currentTurn===p.color?'active':''}"><div class="sdot ${p.connected?'':'off'}"></div><div class="pip" style="background:${CHX[p.color]};box-shadow:0 0 5px ${CHX[p.color]}"></div><span class="pname">${esc(p.name)}</span><span class="pscore">${fin}/4🏠</span>${gameState.currentTurn===p.color?'<span style="font-size:.85rem">▶</span>':''}</div>`;
  }).join('');
  document.getElementById('logList').innerHTML=(gameState.log||[]).slice(0,20).map(e=>`<div class="log-e">${esc(e)}</div>`).join('');
}

function updateDice(v){
  const P={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
  for(let i=1;i<=9;i++){const d=document.getElementById(`d${i}`);d.classList.remove('v','r');}
  (P[v]||[]).forEach(i=>{const d=document.getElementById(`d${i}`);d.classList.add('v');if(v===6)d.classList.add('r');});
  document.getElementById('diceLabel').textContent=`Uscito: ${v}`;
}

function showWinner(){
  const c=gameState.winner,p=gameState.players.find(pl=>pl.color===c);
  const em={red:'🔴',blue:'🔵',green:'🟢',yellow:'🟡'};
  document.getElementById('wEmoji').textContent=em[c]||'🏆';
  document.getElementById('wTitle').textContent=`${p?.name||c} ha vinto!`;
  document.getElementById('wSub').textContent='Bella partita!';
  document.getElementById('wSub').style.color=CHX[c]||'';
  document.getElementById('winnerOverlay').classList.remove('hidden');
}

// ── Board Canvas ──────────────────────────────────────────────────────────────
function renderBoard(){
  const canvas=document.getElementById('boardCanvas');
  if(!S)return;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBg(ctx);drawBases(ctx);drawTrackCells(ctx);drawStretches(ctx);drawCenter(ctx);drawPieces(ctx);
}

function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function drawBg(ctx){ctx.fillStyle='#13122a';rrect(ctx,0,0,S*15,S*15,20);ctx.fill();}

function drawBases(ctx){
  [{c:'red',r:0,col:0},{c:'blue',r:0,col:9},{c:'green',r:9,col:9},{c:'yellow',r:9,col:0}].forEach(({c,r,col})=>{
    const x=col*S,y=r*S,sz=6*S;
    ctx.fillStyle=CHX[c]+'1a';rrect(ctx,x+2,y+2,sz-4,sz-4,14);ctx.fill();
    ctx.strokeStyle=CHX[c]+'55';ctx.lineWidth=1.5;rrect(ctx,x+2,y+2,sz-4,sz-4,14);ctx.stroke();
    const cx2=x+sz/2,cy2=y+sz/2;
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dr,dc])=>{
      const px=cx2+dc*S*.88,py=cy2+dr*S*.88;
      ctx.fillStyle='#0d0c1e';ctx.beginPath();ctx.arc(px,py,S*.29,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=CHX[c]+'66';ctx.lineWidth=1.5;ctx.stroke();
    });
  });
}

function drawTrackCells(ctx){
  TRACK.forEach((pos,i)=>{
    const{r,c}=pos,x=c*S+1.5,y=r*S+1.5,w=S-3,h=S-3;
    let fill='#1c1b36';
    for(const[col,idxs]of Object.entries(SEG)){if(idxs.includes(i)){fill=CHX[col]+'99';break;}}
    if(SAFE.includes(i))fill='#ffffff28';
    ctx.fillStyle=fill;rrect(ctx,x,y,w,h,4);ctx.fill();
    if(SAFE.includes(i)){ctx.fillStyle='rgba(255,255,255,.55)';ctx.font=`bold ${S*.42}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',c*S+S/2,r*S+S/2);}
  });
}

function drawStretches(ctx){
  Object.entries(STRETCH).forEach(([col,cells])=>{
    cells.forEach(({r,c},i)=>{
      const a=Math.round((0.22+i*.13)*255).toString(16).padStart(2,'0');
      ctx.fillStyle=CHX[col]+a;rrect(ctx,c*S+1.5,r*S+1.5,S-3,S-3,4);ctx.fill();
    });
  });
}

function drawCenter(ctx){
  const cx=7.5*S,cy=7.5*S;
  [{c:'red',pts:[[1,7.5],[6,5],[6,10]]},{c:'blue',pts:[[7.5,1],[10,6],[5,6]]},{c:'green',pts:[[14,7.5],[9,10],[9,5]]},{c:'yellow',pts:[[7.5,14],[5,9],[10,9]]}]
  .forEach(({c,pts})=>{ctx.beginPath();ctx.moveTo(pts[0][0]*S,pts[0][1]*S);ctx.lineTo(pts[1][0]*S,pts[1][1]*S);ctx.lineTo(pts[2][0]*S,pts[2][1]*S);ctx.closePath();ctx.fillStyle=CHX[c]+'3a';ctx.fill();});
  ctx.fillStyle='#ffffff18';ctx.beginPath();ctx.arc(cx,cy,S,0,Math.PI*2);ctx.fill();
}

function homePos(color,i){
  const b={red:[0,0],blue:[0,9],green:[9,9],yellow:[9,0]};const[br,bc]=b[color];
  const cx=(bc+3)*S,cy=(br+3)*S;const off=[[-1,-1],[1,-1],[-1,1],[1,1]];const[dr,dc]=off[i];
  return{x:cx+dc*S*.88,y:cy+dr*S*.88};
}

function drawPieces(ctx){
  if(!gameState)return;
  const map={};
  ['red','blue','green','yellow'].forEach(color=>{
    if(!gameState.pieces[color]||!gameState.players.find(p=>p.color===color))return;
    gameState.pieces[color].forEach((piece,i)=>{
      if(piece.finished)return;
      let x,y,key;
      if(piece.trackPos===-1){const p=homePos(color,i);x=p.x;y=p.y;key=`h_${color}_${i}`;}
      else if(piece.homeStretchPos>=0){const cell=STRETCH[color][Math.min(piece.homeStretchPos,5)];if(!cell)return;x=cell.c*S+S/2;y=cell.r*S+S/2;key=`${cell.r}_${cell.c}`;}
      else{const ti=(START[color]+piece.trackPos)%52;const cell=TRACK[ti];if(!cell)return;x=cell.c*S+S/2;y=cell.r*S+S/2;key=`${cell.r}_${cell.c}`;}
      if(!map[key])map[key]=[];map[key].push({color,piece,x,y});
    });
  });
  Object.values(map).forEach(items=>{
    const n=items.length;
    items.forEach(({color,piece,x,y},idx)=>{
      let px=x,py=y;
      if(n>1){const a=(idx/n)*Math.PI*2-Math.PI/2;px+=Math.cos(a)*S*.19;py+=Math.sin(a)*S*.19;}
      const mov=gameState.currentTurn===color&&gameState.movablePieces.includes(piece.id);
      drawPiece(ctx,color,px,py,S*.31,mov);
    });
  });
}

function drawPiece(ctx,color,x,y,r,mov){
  if(mov){
    const t=(Date.now()/500)%1;
    ctx.beginPath();ctx.arc(x,y,r+3+t*4,0,Math.PI*2);
    ctx.strokeStyle=CHX[color]+Math.round((1-t)*160).toString(16).padStart(2,'0');ctx.lineWidth=2;ctx.stroke();
  }
  ctx.shadowColor=mov?CHX[color]:'transparent';ctx.shadowBlur=mov?10:0;
  const g=ctx.createRadialGradient(x-r*.25,y-r*.28,r*.05,x,y,r);g.addColorStop(0,CHL[color]);g.addColorStop(1,CHX[color]);
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle=mov?'rgba(255,255,255,.85)':'rgba(255,255,255,.2)';ctx.lineWidth=mov?2:1;ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,r*.35,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fill();
  ctx.shadowBlur=0;ctx.shadowColor='transparent';
}

document.getElementById('boardCanvas').addEventListener('click',e=>{
  if(!gameState||gameState.phase!=='playing'||!gameState.movablePieces.length)return;
  const canvas=document.getElementById('boardCanvas');const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.width/rect.width),my=(e.clientY-rect.top)*(canvas.height/rect.height);
  const color=gameState.currentTurn;
  for(const pid of gameState.movablePieces){
    const piece=gameState.pieces[color].find(p=>p.id===pid);if(!piece)continue;
    let px,py;
    if(piece.trackPos===-1){const p=homePos(color,pid);px=p.x;py=p.y;}
    else if(piece.homeStretchPos>=0){const cell=STRETCH[color][Math.min(piece.homeStretchPos,5)];if(!cell)continue;px=cell.c*S+S/2;py=cell.r*S+S/2;}
    else{const ti=(START[color]+piece.trackPos)%52;const cell=TRACK[ti];if(!cell)continue;px=cell.c*S+S/2;py=cell.r*S+S/2;}
    if(Math.hypot(mx-px,my-py)<S*.44){sendMsg({type:'move',pieceId:pid});break;}
  }
});

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.addEventListener('resize',()=>{S=0;if(gameState?.phase==='playing')drawAll();});
function loop(){if(gameState?.phase==='playing'&&gameState?.movablePieces?.length)renderBoard();requestAnimationFrame(loop);}
connect();loop();
</script>
